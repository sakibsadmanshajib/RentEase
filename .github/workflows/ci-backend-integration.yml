name: Backend Integration Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: rentease_test
  JWT_SECRET: ci-test-jwt-secret-key-for-github-actions
  ENCRYPTION_KEY: "01234567890123456789012345678901"
  SERVICE_SECRET: ci-test-service-secret-for-github-actions
  GOOGLE_CLIENT_ID: dev-placeholder-client-id
  GOOGLE_CLIENT_SECRET: dev-placeholder-client-secret
  AUTO_MIGRATE: "false"
  CI: "true"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentease_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            filter: identity-service
            project: api-identity
            port: 3001
          - service: organization
            filter: "@rentease/organization-service"
            project: api-tenant
            port: 3005
          - service: property
            filter: property-service
            project: api-property
            port: 3003
          - service: billing
            filter: billing-service
            project: api-billing
            port: 3004

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @rentease/common build
          pnpm --filter @rentease/auth build

      - name: Build service
        run: pnpm --filter "${{ matrix.filter }}" build

      - name: Run database migrations
        run: pnpm --filter "${{ matrix.filter }}" migrate
        continue-on-error: true

      - name: Start service and wait for readiness
        run: bash scripts/ci/start-backend-service.sh "${{ matrix.filter }}" "${{ matrix.port }}"

      - name: Run Playwright API tests
        run: pnpm exec playwright test --project=${{ matrix.project }} --grep @api
        timeout-minutes: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.service }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== Service Logs ==="
          cat service.log || echo "No service logs found"
