name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: rentease_test
  JWT_SECRET: ci-test-jwt-secret-key-for-github-actions
  ENCRYPTION_KEY: "01234567890123456789012345678901"
  SERVICE_SECRET: ci-test-service-secret-for-github-actions
  GOOGLE_CLIENT_ID: dev-placeholder-client-id
  GOOGLE_CLIENT_SECRET: dev-placeholder-client-secret
  AUTO_MIGRATE: "false"
  NEXT_PUBLIC_API_URL: http://localhost:3001
  CI: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentease_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm turbo build

      - name: Run database migrations
        run: |
          pnpm --filter identity-service migrate || true
          pnpm --filter "@rentease/organization-service" migrate || true
          pnpm --filter property-service migrate || true
          pnpm --filter billing-service migrate || true

      - name: Start backend services
        run: |
          bash scripts/ci/start-backend-service.sh identity-service 3001 identity.log
          bash scripts/ci/start-backend-service.sh "@rentease/organization-service" 3005 organization.log
          bash scripts/ci/start-backend-service.sh property-service 3003 property.log
          bash scripts/ci/start-backend-service.sh billing-service 3004 billing.log

      - name: Start frontend
        run: |
          pnpm --filter web dev > web.log 2>&1 &
          bash scripts/ci/wait-for-http.sh http://127.0.0.1:3000 120

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
        timeout-minutes: 5

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium-e2e
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== Identity Service ==="
          cat identity.log || echo "No identity logs"
          echo "=== Organization Service ==="
          cat organization.log || echo "No organization logs"
          echo "=== Property Service ==="
          cat property.log || echo "No property logs"
          echo "=== Billing Service ==="
          cat billing.log || echo "No billing logs"
          echo "=== Web Frontend ==="
          cat web.log || echo "No web logs"
