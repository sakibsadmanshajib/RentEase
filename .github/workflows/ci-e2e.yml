name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_DATABASE: rentease_test
  JWT_SECRET: test-jwt-secret-for-ci
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentease_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm turbo build

      - name: Run migrations
        run: bash scripts/migrate-all.sh

      - name: Start all services
        run: |
          pnpm --filter identity-service dev > identity.log 2>&1 &
          pnpm --filter organization-service dev > organization.log 2>&1 &
          pnpm --filter property-service dev > property.log 2>&1 &
          pnpm --filter billing-service dev > billing.log 2>&1 &
          pnpm --filter api-gateway dev > gateway.log 2>&1 &
          pnpm --filter web dev > web.log 2>&1 &

          echo "Waiting for services to start..."
          sleep 30

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm playwright test --project=chromium-e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 3

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== Identity Service ===" 
          cat identity.log || echo "No identity logs"
          echo "=== Organization Service ==="
          cat organization.log || echo "No organization logs"
          echo "=== Property Service ==="
          cat property.log || echo "No property logs"
          echo "=== Billing Service ==="
          cat billing.log || echo "No billing logs"
          echo "=== API Gateway ==="
          cat gateway.log || echo "No gateway logs"
          echo "=== Web Frontend ==="
          cat web.log || echo "No web logs"
